services:
  # Prometheus
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring-docs/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring-docs/recording_rules.yml:/etc/prometheus/recording_rules.yml
      - ./monitoring-docs/alert_rules.yml:/etc/prometheus/alert_rules.yml

  # Frontend container
  frontend:
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3000
    build: ./frontend
    ports:
      - "3001:3000" # Changed to 3001 to avoid conflict with nginx
    volumes:
      - ./frontend:/usr/src/app
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx reverse proxy for friendly startup page
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped

  # Backend API container
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MONGODB_URI=mongodb://mongo:27017/brainbytes
    depends_on:
      - mongo
      - prometheus
    restart: unless-stopped

  # MongoDB container
  mongo:
    image: mongo:4.4
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    ports:
      - "9100:9100"

  # Grafana service
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring-docs/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring-docs/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

# Define volumes for persistent data
volumes:
  mongo-data:
