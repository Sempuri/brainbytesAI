global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'brainbytes_backend'
    static_configs:
      - targets: ['host.docker.internal:3000']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

rule_files:
  - "recording_rules.yml"
  - "alert_rules.yml"