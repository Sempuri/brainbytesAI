global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'brainbytes_backend'
    static_configs:
      - targets: ['backend:3000']
    relabel_configs:
      - source_labels: ['__address__']
        regex: '(.*):.*'
        target_label: 'instance'
        replacement: '$1'

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

rule_files:
  - "recording_rules.yml"
  - "alert_rules.yml"